<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Siphesihle's Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav>
            <img src="images/my_logo.png" alt="SDywili Logo" class="logo" style="width: 100px;height: auto;">
            <button class="hamb">☰</button>

            <div class="navL">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About me</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <hr>

    <section id="contact">
        <h2>Contact Us</h2>

        <div class="contact-layout">
            <div class="contact-form">
                <form class="flex-form">
                    <div class="form-group">
                        <label>Full Name:</label>
                        <input type="text" name="name" placeholder="Enter your name" required />
                    </div>
                    <div class="form-group">
                        <label>Email:</label>
                        <input type="email" name="email" placeholder="Enter your email" required />
                    </div>
                    <div class="form-group">
                        <label>Message:</label>
                        <textarea name="message" placeholder="Enter your message" rows="4" required></textarea>
                    </div>
                    <button type="submit">Submit</button>
                </form>
            </div>

            <div class="map-container">
                <iframe
                    src="https://maps.google.com/maps?q=Marshall%20Street,%20Polokwane,%20South%20Africa&t=&z=15&ie=UTF8&iwloc=&output=embed"
                    width="100%" height="100%" style="border:0; border-radius: 10px;" allowfullscreen="" loading="lazy">
                </iframe>
            </div>
        </div>
    </section>

    <hr>

    <footer>
        <div class="footer-layout">
            <div class="footer-address">
                <p><strong>Address Here</strong><br>159 Marshall Street<br>Polokwane, Limpopo<br>0699<br>South Africa
                </p>
            </div>

            <div class="footer-socials">
                <a href="https://www.facebook.com/siphesihle.dywili" class="social-circle">F</a>
                <a href="https://www.linkedin.com/in/siphesihle-dywili-2b1108333/" class="social-circle">L</a>
                <a href="https://wa.me/27603134368" class="social-circle">W</a>
            </div>

            <div class="footer-links">
                <p><strong>Additional Quick Links</strong></p>
                <p>Phone: <a href="tel:+27603134368">+27 60 313 4368</a></p>
            </div>
        </div>
        <p style="text-align: center; margin-top: 20px;">© 2026 Siphesihle Dywili.</p>
    </footer>

    <script>
        const hamburger = document.querySelector('.hamb');
        const navL = document.querySelector('.navL');
        const navLinks = document.querySelectorAll('.navL ul li a');

        hamburger.addEventListener(
            "click",
            function () {
                navL.classList.toggle('active');
            }
        );

        navLinks.forEach(link => {
            link.addEventListener("click",
                function () {
                    navL.classList.remove('active');
                });
        });
    </script>
</body>

</html>
